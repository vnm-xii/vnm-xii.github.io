<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Haneen | تجربة تفاعلية خاصة ✨</title>
  <!-- المكتبات الأساسية: Three.js للثري دي + GSAP للتحريك الفيزيائي + Confetti للاحتفال -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Playfair+Display:ital,wght@0,700;1,700&family=JetBrains+Mono:wght@400;700&display=swap');

    :root {
      --bg-deep: #04040a;
      --crimson: #ff1e56;
      --rose-glow: #f594b8;
      --rose-core: #d52d58;
      --cyan: #00f2fe;
      --gold: #ffd166;
    }

    * {
      margin: 0; padding: 0; box-sizing: border-box;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background-color: var(--bg-deep);
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      touch-action: none;
    }

    /* خلفية الفضاء والقلب ثلاثي الأبعاد */
    #webglContainer {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    /* الشريط العلوي السينمائي */
    .hud-top {
      position: fixed;
      top: 18px; left: 20px; right: 20px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }

    .hud-pill {
      pointer-events: auto;
      background: rgba(8, 10, 22, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.14);
      backdrop-filter: blur(12px);
      padding: 7px 15px;
      border-radius: 30px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.75rem;
      color: var(--cyan);
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .pulse-led {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--crimson);
      box-shadow: 0 0 10px var(--crimson);
      animation: ledBlink 0.9s infinite alternate;
    }
    @keyframes ledBlink { to { opacity: 0.25; transform: scale(0.75); } }

    .step-dots {
      display: flex;
      gap: 6px;
    }
    .step-dot {
      width: 18px; height: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.18);
      transition: all 0.5s ease;
    }
    .step-dot.active {
      width: 34px;
      background: linear-gradient(90deg, var(--cyan), var(--crimson));
      box-shadow: 0 0 10px var(--crimson);
    }

    /* عناوين المشاهد العائمة في الأعلى بدون صناديق تقليدية */
    .scene-header {
      position: fixed;
      top: 68px; left: 0; right: 0;
      z-index: 50;
      text-align: center;
      padding: 0 20px;
      pointer-events: none;
    }
    .scene-header h1 {
      font-size: 1.65rem;
      font-weight: 900;
      background: linear-gradient(90deg, #fff, #ff9ebb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 4px 15px rgba(255, 30, 86, 0.4));
      margin-bottom: 6px;
    }
    .scene-header p {
      font-size: 0.96rem;
      color: #c5cbe3;
      max-width: 440px;
      margin: 0 auto;
      line-height: 1.65;
      text-shadow: 0 2px 10px #000;
    }

    /* حاويات المشاهد الـ 6 */
    .scene-layer {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
      opacity: 0;
    }
    .scene-layer.active {
      display: flex;
      opacity: 1;
    }

    .btn-neon {
      pointer-events: auto;
      background: linear-gradient(135deg, var(--crimson), #9e0b37);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 13px 34px;
      border-radius: 50px;
      font-family: 'Tajawal', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 30, 86, 0.55);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-neon:active { transform: scale(0.94); }

    /* ==================== المشهد 1: المونيتور الطبي والبصمة ==================== */
    .ecg-monitor {
      width: 90%;
      max-width: 420px;
      height: 140px;
      border-radius: 20px;
      background: rgba(5, 7, 16, 0.75);
      border: 1px solid rgba(255, 30, 86, 0.35);
      box-shadow: 0 0 35px rgba(255, 30, 86, 0.15), inset 0 0 25px rgba(0, 0, 0, 0.8);
      position: relative;
      overflow: hidden;
      margin-bottom: 35px;
    }
    .ecg-grid-bg {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(0, 242, 254, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 242, 254, 0.06) 1px, transparent 1px);
      background-size: 18px 18px;
    }
    canvas#ecgCanvas {
      width: 100%; height: 100%;
      position: relative; z-index: 2;
    }
    .bpm-readout {
      position: absolute;
      top: 10px; left: 14px;
      z-index: 3;
      font-family: 'JetBrains Mono', monospace;
      color: var(--crimson);
      font-size: 1.1rem;
      font-weight: bold;
      text-shadow: 0 0 10px var(--crimson);
    }

    .biometric-pad {
      pointer-events: auto;
      position: relative;
      width: 130px; height: 130px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }
    .bio-svg {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
    }
    .ring-track { fill: none; stroke: rgba(255,255,255,0.1); stroke-width: 2; }
    .ring-tech {
      fill: none; stroke: var(--cyan); stroke-width: 2;
      stroke-dasharray: 24 14 6 14;
      transform-origin: center;
      animation: spinRing 9s linear infinite;
    }
    .ring-prog {
      fill: none; stroke: var(--crimson); stroke-width: 4.5;
      stroke-linecap: round;
      stroke-dasharray: 345; stroke-dashoffset: 345;
      transform: rotate(-90deg); transform-origin: center;
      filter: drop-shadow(0 0 10px var(--crimson));
    }
    @keyframes spinRing { to { transform: rotate(360deg); } }

    .fp-core {
      width: 82px; height: 82px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,30,86,0.22), transparent 72%);
      display: flex; justify-content: center; align-items: center;
      position: relative; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .fp-core svg {
      width: 46px; height: 46px;
      stroke: #fff; stroke-width: 1.7; fill: none;
      transition: stroke 0.3s;
    }
    .scan-laser {
      position: absolute;
      width: 100%; height: 3px;
      background: var(--cyan);
      box-shadow: 0 0 15px var(--cyan), 0 0 30px var(--cyan);
      top: 0; opacity: 0;
    }
    .scanning .scan-laser {
      opacity: 1;
      animation: laserSweep 0.85s ease-in-out infinite alternate;
    }
    .scanning .fp-core svg { stroke: var(--crimson); }
    @keyframes laserSweep { from { top: 8%; } to { top: 92%; } }

    /* ==================== المشهد 2: سماعة الطبيب ونقاط النبض حول القلب 3D ==================== */
    .auscultation-zone {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 25;
    }
    .pulse-hotspot {
      pointer-events: auto;
      position: absolute;
      width: 54px; height: 54px;
      border-radius: 50%;
      border: 1.5px dashed rgba(0, 242, 254, 0.7);
      background: radial-gradient(circle, rgba(255,30,86,0.35), transparent 70%);
      display: flex; justify-content: center; align-items: center;
      cursor: pointer;
      color: #fff;
      font-size: 1.2rem;
      box-shadow: 0 0 20px rgba(255, 30, 86, 0.5);
      animation: hotspotPulse 1.5s infinite alternate;
      transition: all 0.3s;
    }
    .pulse-hotspot.checked {
      border-style: solid;
      border-color: var(--cyan);
      background: radial-gradient(circle, rgba(0,242,254,0.35), transparent 70%);
      box-shadow: 0 0 20px var(--cyan);
    }
    @keyframes hotspotPulse {
      from { transform: scale(0.92); }
      to { transform: scale(1.12); }
    }

    /* الكبسولة الطبية العائمة لعرض تشخيص السماعة */
    .stetho-hud {
      position: fixed;
      bottom: 28px; left: 20px; right: 20px;
      max-width: 450px;
      margin: 0 auto;
      background: rgba(10, 12, 26, 0.82);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 242, 254, 0.3);
      border-radius: 22px;
      padding: 18px 20px;
      z-index: 30;
      pointer-events: auto;
      text-align: right;
      box-shadow: 0 15px 40px rgba(0,0,0,0.7);
    }
    .stetho-title {
      color: var(--gold);
      font-weight: 700;
      font-size: 0.95rem;
      margin-bottom: 5px;
      display: flex;
      justify-content: space-between;
    }
    .stetho-body {
      color: #eef2ff;
      font-size: 0.95rem;
      line-height: 1.7;
    }

    /* ==================== المشهد 3: مسح البخار عن الصور (Scratch-to-Reveal) ==================== */
    .scratch-stage-box {
      pointer-events: auto;
      position: relative;
      width: 300px;
      background: rgba(16, 18, 36, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 24px;
      padding: 14px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.85), 0 0 30px rgba(255, 30, 86, 0.25);
      text-align: center;
      margin-top: 35px;
    }
    .photo-viewport {
      position: relative;
      width: 100%; height: 250px;
      border-radius: 16px;
      overflow: hidden;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: flex-end;
      padding: 14px;
    }
    .photo-viewport::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(8,8,20,0.88) 5%, transparent 55%);
      pointer-events: none;
    }
    /* كانفاس الضباب الذي تمسحه حنين بإصبعها */
    canvas#scratchCanvas {
      position: absolute;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 5;
      cursor: crosshair;
    }
    .photo-inner-tag {
      position: relative; z-index: 2;
      color: var(--gold);
      font-weight: 700;
      font-size: 0.85rem;
    }
    .photo-caption-txt {
      color: #e2e8f0;
      font-size: 0.95rem;
      margin: 12px 0 10px;
      line-height: 1.6;
      min-height: 48px;
    }
    .carousel-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .btn-mini {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff;
      padding: 8px 16px;
      border-radius: 20px;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.85rem;
      cursor: pointer;
    }

    /* ==================== المشهد 4: لعبة القوس والسهم (Bow & Arrow) ==================== */
    .archery-arena {
      pointer-events: auto;
      position: relative;
      width: 100%;
      max-width: 420px;
      height: 430px;
      margin-top: 30px;
    }
    #archerySvg {
      width: 100%; height: 100%;
      overflow: visible;
    }

    /* ==================== المشهد 5: الوردة السحرية المطابقة للفيديو 1 ==================== */
    .rose-circle-world {
      pointer-events: auto;
      width: 310px; height: 310px;
      border-radius: 50%;
      background: #1a1e46;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 55px rgba(245, 148, 184, 0.3), inset 0 0 35px rgba(0,0,0,0.6);
      border: 2px solid rgba(245, 148, 184, 0.35);
      margin-top: 25px;
    }
    .hill-b1 { position: absolute; bottom: 25px; left: -40px; width: 230px; height: 105px; background: #14193d; border-radius: 50%; }
    .hill-b2 { position: absolute; bottom: 15px; right: -45px; width: 240px; height: 105px; background: #172a45; border-radius: 50%; }
    .hill-b3 { position: absolute; bottom: -30px; left: -20px; right: -20px; height: 90px; background: #0d2833; border-radius: 50% 50% 0 0; z-index: 2; }

    .rose-inside-title {
      position: absolute;
      top: 32px; width: 100%;
      text-align: center;
      font-family: 'Playfair Display', Georgia, serif;
      font-weight: bold;
      font-size: 1.45rem;
      color: #ff3b6b;
      text-shadow: 0 0 15px #f594b8;
      z-index: 6;
      line-height: 1.25;
      opacity: 0.15;
      transition: opacity 0.8s ease;
    }
    .rose-inside-title span { display: block; color: #f594b8; font-size: 1.25rem; }

    .dome-jar {
      position: absolute;
      bottom: 34px; left: 50%;
      transform: translateX(-50%);
      width: 114px; height: 162px;
      border: 2.5px solid rgba(170, 225, 255, 0.38);
      border-bottom: 6px solid #071921;
      border-radius: 60px 60px 6px 6px;
      background: linear-gradient(135deg, rgba(255,255,255,0.14) 0%, rgba(245,148,184,0.06) 50%, rgba(0,210,255,0.1) 100%);
      box-shadow: 0 0 25px rgba(245, 148, 184, 0.2), inset 10px 0 18px rgba(255,255,255,0.2);
      z-index: 5;
      transition: box-shadow 0.8s;
    }
    .r-stem { position: absolute; bottom: 0; left: 54px; width: 5px; height: 80px; background: #0d694e; }
    .r-leaf { position: absolute; width: 22px; height: 13px; background: #138765; border-radius: 15px 0 15px 0; }
    .r-leaf.l { bottom: 32px; left: 33px; transform: rotate(-25deg); }
    .r-leaf.r { bottom: 43px; left: 57px; transform: rotate(25deg) scaleX(-1); }

    .r-petals {
      position: absolute;
      bottom: 70px; left: 50%;
      transform: translateX(-50%) scale(0.85);
      width: 56px; height: 56px;
      filter: brightness(0.45);
      transition: all 0.7s ease;
    }
    .r-petals > div {
      position: absolute;
      border-radius: 15px;
      box-shadow: 0px 0px 30px #f594b8;
      background: linear-gradient(to bottom, #ff7aa8, #d52d58 70%, #9e1b3e);
    }
    .r-petals > div:nth-child(1) { width: 26px; height: 38px; left: 15px; top: 8px; border-radius: 14px 14px 18px 18px; z-index: 5; }
    .r-petals > div:nth-child(2) { width: 24px; height: 35px; left: 5px; top: 11px; transform: rotate(-20deg); z-index: 4; }
    .r-petals > div:nth-child(3) { width: 24px; height: 35px; right: 5px; top: 11px; transform: rotate(20deg); z-index: 4; }
    .r-petals > div:nth-child(4) { width: 22px; height: 30px; left: -1px; top: 15px; transform: rotate(-38deg); background: #b51f45; z-index: 3; }
    .r-petals > div:nth-child(5) { width: 22px; height: 30px; right: -1px; top: 15px; transform: rotate(38deg); background: #b51f45; z-index: 3; }

    .r-dead-petal {
      position: absolute;
      width: 13px; height: 8px;
      left: 50px; top: 55px;
      background: #d52d58;
      border-radius: 12px 0 12px 0;
      box-shadow: 0 0 12px #f594b8;
      animation: fallPetalAnim 4.2s ease-in-out infinite;
      z-index: 4;
    }
    @keyframes fallPetalAnim {
      0% { transform: translate(0, 0) rotate(-30deg); opacity: 1; }
      75% { transform: translate(-20px, 75px) rotate(40deg); opacity: 1; }
      100% { transform: translate(-22px, 80px) rotate(55deg); opacity: 0; }
    }

    /* شرارات الإضاءة الـ 3 حول القبة */
    .dew-spark {
      position: absolute;
      width: 40px; height: 40px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff, var(--crimson));
      box-shadow: 0 0 20px var(--crimson);
      z-index: 10;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer;
      font-size: 1rem;
      animation: sparkFloat 1.2s infinite alternate;
      transition: transform 0.3s, opacity 0.3s;
    }
    @keyframes sparkFloat { to { transform: scale(1.2); } }

    /* ==================== المشهد 6: التورتة + المايكروفون + الروشتة الختامية ==================== */
    .cake-interactive-box {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 25px;
      cursor: pointer;
    }
    .candles-group {
      display: flex;
      gap: 16px;
      margin-bottom: -5px;
      z-index: 6;
      opacity: 0;
    }
    .c-stick {
      width: 9px; height: 36px;
      background: repeating-linear-gradient(45deg, #fff, #fff 4px, #ff1e56 4px, #ff1e56 8px);
      border-radius: 3px;
      position: relative;
    }
    .c-flame {
      width: 13px; height: 22px;
      background: radial-gradient(circle, #fff 15%, #ffeb3b 55%, #ff6b00 95%);
      border-radius: 50% 50% 35% 35%;
      position: absolute;
      top: -24px; left: -2px;
      box-shadow: 0 0 18px #ffeb3b, 0 0 35px #ff6b00;
      animation: flameDance 0.14s infinite alternate;
      transition: all 0.4s ease;
    }
    .c-flame.out { opacity: 0; transform: translateY(-20px) scale(0); }
    @keyframes flameDance {
      from { transform: rotate(-4deg) scale(0.94); }
      to { transform: rotate(4deg) scale(1.06); }
    }

    .cake-icing {
      width: 214px; height: 22px;
      background: #fff0f5;
      border-radius: 12px 12px 8px 8px;
      z-index: 4;
      margin-bottom: -10px;
      transform: translateY(-220px);
      opacity: 0;
    }
    .cake-tier {
      width: 210px; height: 42px;
      background: #c2255c;
      border-radius: 8px;
      margin-top: -3px;
      border-bottom: 4px solid #fff0f5;
      box-shadow: 0 6px 15px rgba(0,0,0,0.5);
      transform: translateY(-220px);
      opacity: 0;
    }
    .cake-tier.mid { background: #e64980; }
    .cake-tier.top { background: #ff7597; }
    .cake-plate {
      width: 250px; height: 10px;
      background: #e2e8f0;
      border-radius: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
    }

    .mic-gauge-wrap {
      width: 250px; height: 10px;
      background: rgba(255,255,255,0.12);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 20px;
      border: 1px solid rgba(0, 242, 254, 0.35);
    }
    .mic-gauge-fill {
      width: 4%; height: 100%;
      background: linear-gradient(90deg, var(--cyan), var(--crimson));
      box-shadow: 0 0 12px var(--crimson);
      transition: width 0.08s;
    }

    /* الروشتة الطبية الختامية الفخمة (Rx Prescription) */
    .rx-prescription {
      pointer-events: auto;
      display: none;
      width: 92%;
      max-width: 440px;
      background: rgba(12, 14, 28, 0.88);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 209, 102, 0.45);
      border-radius: 24px;
      padding: 24px 22px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.85), 0 0 35px rgba(255, 30, 86, 0.25);
      text-align: right;
    }
    .rx-top-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px dashed rgba(255,255,255,0.2);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .rx-symbol {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      color: var(--gold);
      font-weight: bold;
    }
    .rx-body-text {
      color: #f1f5f9;
      font-size: 1.02rem;
      line-height: 1.85;
      min-height: 120px;
    }
    .rx-stamp {
      margin-top: 16px;
      text-align: left;
      font-family: 'Playfair Display', serif;
      color: var(--rose-glow);
      font-size: 1rem;
    }
  </style>
</head>
<body>

  <!-- موسيقى بيانو سينمائية دافئة تعمل فور لمس البصمة (أو ضع ملف music.mp3 في نفس المجلد) -->
  <audio id="bgAudio" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
    <source src="https://cdn.pixabay.com/download/audio/2022/08/02/audio_884fe92c21.mp3" type="audio/mpeg">
  </audio>

  <div id="webglContainer"></div>

  <!-- الهيدر العائم -->
  <div class="hud-top">
    <div class="hud-pill">
      <div class="pulse-led"></div>
      <span id="hudModeTxt">BIO-MONITOR // HANEEN</span>
    </div>
    <div class="step-dots">
      <div class="step
