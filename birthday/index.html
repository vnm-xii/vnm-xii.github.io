<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Haneen | تجربة خاصة ✨</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Playfair+Display:ital,wght@1,700&display=swap');

    :root {
      --bg-dark: #04040a;
      --bg-glow: #130b24;
      --accent: #ff2a7a;
      --accent-soft: #ff7aa8;
      --cyan: #00f2fe;
      --gold: #ffd166;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; user-select: none; -webkit-tap-highlight-color: transparent; }

    body {
      background: radial-gradient(circle at 50% 35%, var(--bg-glow) 0%, var(--bg-dark) 85%);
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    /* خلفية الجزيئات التفاعلية الشاملة */
    canvas#universe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* الهيدر السينمائي العائم */
    .hud-header {
      position: fixed;
      top: 20px; left: 24px; right: 24px;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .timeline-bar {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .step-pill {
      width: 24px; height: 4px;
      border-radius: 4px;
      background: rgba(255, 255, 255, 0.18);
      transition: all 0.6s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .step-pill.active {
      width: 45px;
      background: linear-gradient(90deg, var(--cyan), var(--accent));
      box-shadow: 0 0 12px var(--accent);
    }

    .audio-pill {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      color: #fff;
      padding: 7px 15px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-family: 'Tajawal', sans-serif;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }
    .audio-bars {
      display: flex;
      gap: 2px;
      align-items: flex-end;
      height: 12px;
    }
    .audio-bars span {
      width: 2.5px;
      background: var(--cyan);
      height: 4px;
      border-radius: 2px;
      transition: height 0.2s;
    }
    .playing .audio-bars span:nth-child(1) { animation: eq 0.6s infinite alternate; }
    .playing .audio-bars span:nth-child(2) { animation: eq 0.45s infinite alternate 0.2s; }
    .playing .audio-bars span:nth-child(3) { animation: eq 0.7s infinite alternate 0.4s; }
    @keyframes eq { to { height: 12px; background: var(--accent-soft); } }

    /* المشاهد السينمائية */
    .scene {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 70px 24px 30px;
      opacity: 0;
      pointer-events: none;
      transform: scale(0.94) translateY(20px);
      filter: blur(8px);
      transition: opacity 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                  transform 0.85s cubic-bezier(0.16, 1, 0.3, 1),
                  filter 0.85s cubic-bezier(0.16, 1, 0.3, 1);
      text-align: center;
    }
    .scene.active {
      opacity: 1;
      pointer-events: auto;
      transform: scale(1) translateY(0);
      filter: blur(0);
    }

    .tag-line {
      font-size: 0.8rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--cyan);
      margin-bottom: 8px;
      font-weight: 700;
      opacity: 0.9;
    }

    .scene-title {
      font-size: 1.75rem;
      font-weight: 900;
      margin-bottom: 10px;
      background: linear-gradient(to left, #fff, #ffc2d9);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .scene-sub {
      color: #b8bdd9;
      font-size: 1rem;
      max-width: 430px;
      line-height: 1.75;
      margin-bottom: 22px;
    }

    .btn-action {
      background: linear-gradient(135deg, var(--accent), #a81c51);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 13px 36px;
      border-radius: 40px;
      font-family: 'Tajawal', sans-serif;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 42, 122, 0.45);
      transition: all 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      opacity: 0;
      transform: translateY(15px);
      pointer-events: none;
    }
    .btn-action.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    .btn-action:active { transform: scale(0.95); }

    /* ================= المشهد 1: البصمة بموشن جرافيك وتخطيط القلب ================= */
    .monitor-wrap {
      width: 100%;
      max-width: 420px;
      height: 170px;
      position: relative;
      margin-bottom: 25px;
    }
    canvas#heartMorphCanvas {
      width: 100%;
      height: 100%;
    }

    .bio-scanner-wrap {
      position: relative;
      width: 130px;
      height: 130px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      margin: 5px 0 15px;
    }
    .bio-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }
    .ring-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.1);
      stroke-width: 3;
    }
    .ring-spin {
      fill: none;
      stroke: var(--cyan);
      stroke-width: 2;
      stroke-dasharray: 40 20;
      animation: orbitSpin 8s linear infinite;
      transform-origin: center;
    }
    .ring-progress {
      fill: none;
      stroke: var(--accent);
      stroke-width: 4.5;
      stroke-linecap: round;
      stroke-dasharray: 345;
      stroke-dashoffset: 345;
      filter: drop-shadow(0 0 8px var(--accent));
      transition: stroke-dashoffset 0.1s linear;
    }
    @keyframes orbitSpin { to { transform: rotate(270deg); } }

    .fingerprint-core {
      width: 82px;
      height: 82px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255, 42, 122, 0.2), rgba(0, 242, 254, 0.05));
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .laser-line {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      background: var(--cyan);
      box-shadow: 0 0 12px var(--cyan);
      opacity: 0;
    }
    .scanning .laser-line {
      opacity: 1;
      animation: laserScan 1.1s ease-in-out infinite alternate;
    }
    @keyframes laserScan {
      from { top: 8%; }
      to { top: 92%; }
    }
    .fp-icon {
      width: 44px;
      height: 44px;
      stroke: #fff;
      stroke-width: 1.8;
      fill: none;
      opacity: 0.85;
      transition: stroke 0.3s, transform 0.3s;
    }
    .scanning .fp-icon {
      stroke: var(--accent-soft);
      transform: scale(1.08);
    }

    /* ================= المشهد 2: الكرات المضيئة العائمة (Orbs) ================= */
    .orbs-arena {
      position: relative;
      width: 100%;
      max-width: 430px;
      height: 230px;
      margin: 5px 0 15px;
    }
    .orb {
      position: absolute;
      width: 78px;
      height: 78px;
      border-radius: 50%;
      background: radial-gradient(circle at 30% 30%, #fff, var(--accent-soft) 45%, var(--accent) 85%);
      box-shadow: 0 0 30px var(--accent), inset 0 0 15px #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.6rem;
      cursor: pointer;
      animation: floatOrb 3.5s ease-in-out infinite alternate;
      transition: all 0.45s cubic-bezier(0.22, 1, 0.36, 1);
    }
    .orb.unlocked {
      background: radial-gradient(circle at 30% 30%, #fff, var(--cyan) 55%, #0066ff 95%);
      box-shadow: 0 0 25px var(--cyan);
      transform: scale(0.85);
    }
    @keyframes floatOrb {
      from { transform: translateY(-8px) rotate(-4deg); }
      to { transform: translateY(10px) rotate(4deg); }
    }

    .insight-glass {
      width: 100%;
      max-width: 440px;
      min-height: 115px;
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 22px;
      padding: 18px 22px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      margin-bottom: 18px;
      transition: all 0.4s;
    }
    .insight-title {
      color: var(--gold);
      font-weight: 700;
      font-size: 1rem;
      margin-bottom: 6px;
    }
    .insight-text {
      color: #eef0ff;
      font-size: 0.98rem;
      line-height: 1.7;
    }

    /* ================= المشهد 3: شريط الذكريات السينمائي ================= */
    .carousel-stage {
      position: relative;
      width: 100%;
      max-width: 340px;
      height: 350px;
      perspective: 1000px;
      margin-bottom: 20px;
    }
    .memory-card {
      position: absolute;
      inset: 0;
      background: rgba(18, 16, 36, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.65);
      transition: all 0.65s cubic-bezier(0.22, 1, 0.36, 1);
      cursor: pointer;
    }
    .mem-visual {
      width: 100%;
      height: 235px;
      border-radius: 16px;
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 16px;
      text-align: right;
    }
    .mem-visual::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(to top, rgba(6,6,18,0.9) 10%, transparent 65%);
    }
    .mem-overlay-content {
      position: relative;
      z-index: 2;
    }
    .mem-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 6px 2px;
    }

    /* ================= المشهد 4: الوردة السحرية المطابقة للفيديو 1 ================= */
    .rose-world {
      width: 280px;
      height: 280px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 35%, #202459 0%, #0d102b 75%);
      position: relative;
      overflow: hidden;
      margin: 5px auto 18px;
      box-shadow: 0 0 45px rgba(245, 148, 184, 0.25), inset 0 0 35px rgba(0,0,0,0.7);
      border: 2px solid rgba(245, 148, 184, 0.35);
    }
    .hill-1 { position: absolute; bottom: 18px; left: -30px; width: 210px; height: 85px; background: #14193f; border-radius: 50%; }
    .hill-2 { position: absolute; bottom: 10px; right: -35px; width: 230px; height: 90px; background: #17273c; border-radius: 50%; }
    .hill-3 { position: absolute; bottom: -25px; left: -20px; right: -20px; height: 80px; background: #0c2631; border-radius: 50% 50% 0 0; z-index: 2; }

    .dome-title {
      position: absolute;
      top: 26px; width: 100%;
      font-family: 'Playfair Display', serif;
      color: #ff4d79;
      font-size: 1.35rem;
      text-shadow: 0 0 12px rgba(245, 148, 184, 0.9);
      z-index: 6;
      opacity: 0.3;
      transition: opacity 0.8s;
    }
    .dome-glass {
      position: absolute;
      bottom: 32px; left: 50%;
      transform: translateX(-50%);
      width: 106px; height: 150px;
      border: 2.5px solid rgba(180, 220, 255, 0.35);
      border-bottom: 6px solid #081c24;
      border-radius: 55px 55px 6px 6px;
      background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, rgba(245,148,184,0.06) 50%, rgba(0,210,255,0.08) 100%);
      box-shadow: 0 0 25px rgba(245, 148, 184, 0.25), inset 8px 0 15px rgba(255,255,255,0.15);
      z-index: 5;
      transition: box-shadow 0.8s;
    }
    .rose-structure {
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 100px; height: 140px;
    }
    .r-stem { position: absolute; bottom: 0; left: 48px; width: 5px; height: 74px; background: #0e6b50; }
    .r-leaf { position: absolute; width: 22px; height: 13px; background: #138564; border-radius: 15px 0 15px 0; }
    .r-leaf.l { bottom: 30px; left: 28px; transform: rotate(-25deg); }
    .r-leaf.r { bottom: 40px; left: 51px; transform: rotate(25deg) scaleX(-1); }

    .r-head {
      position: absolute;
      bottom: 64px; left: 50%;
      transform: translateX(-50%);
      width: 50px; height: 50px;
      filter: drop-shadow(0 0 15px #f594b8);
      transition: filter 0.6s, transform 0.6s;
    }
    .r-petal {
      position: absolute;
      background: linear-gradient(to bottom, #ff7aa8, #d52d58 65%, #9e1b3e);
      border-radius: 15px;
    }
    .rp-c { width: 24px; height: 34px; left: 13px; top: 8px; border-radius: 12px 12px 16px 16px; z-index: 4; }
    .rp-l1 { width: 22px; height: 32px; left: 4px; top: 10px; transform: rotate(-18deg); z-index: 3; }
    .rp-r1 { width: 22px; height: 32px; right: 4px; top: 10px; transform: rotate(18deg); z-index: 3; }
    .rp-l2 { width: 20px; height: 28px; left: -2px; top: 14px; transform: rotate(-35deg); background: #b82047; z-index: 2; }
    .rp-r2 { width: 20px; height: 28px; right: -2px; top: 14px; transform: rotate(35deg); background: #b82047; z-index: 2; }

    .falling-p {
      position: absolute;
      width: 12px; height: 8px;
      background: #d52d58;
      border-radius: 10px 0 10px 0;
      left: 42px; top: 45px;
      box-shadow: 0 0 10px #f594b8;
      animation: fallLoop 4s ease-in-out infinite;
      z-index: 4;
    }
    @keyframes fallLoop {
      0% { transform: translate(0, 0) rotate(-20deg); opacity: 1; }
      75% { transform: translate(-18px, 65px) rotate(45deg); opacity: 1; }
      100% { transform: translate(-20px, 70px) rotate(60deg); opacity: 0; }
    }

    /* شرارات الإضاءة التفاعلية حول الوردة */
    .spark-point {
      position: absolute;
      width: 34px; height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle, #fff, var(--accent));
      box-shadow: 0 0 18px var(--accent);
      z-index: 10;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 0.9rem;
      animation: pulseSpark 1.2s infinite alternate;
      transition: transform 0.3s, opacity 0.3s;
    }
    @keyframes pulseSpark { to { transform: scale(1.22); } }

    /* ================= المشهد 5: التورتة الختامية والمايكروفون ================= */
    .cake-wrap {
      position: relative;
      padding: 35px 0 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }
    .tier {
      border-radius: 10px 10px 4px 4px;
      position: relative;
      box-shadow: 0 6px 18px rgba(0,0,0,0.45);
    }
    .tier::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 11px;
      background: #fff0f6;
      border-radius: 10px 10px 8px 8px;
    }
    .t-1 { width: 125px; height: 42px; background: #ff7597; }
    .t-2 { width: 170px; height: 50px; background: #e64980; }
    .t-3 { width: 215px; height: 58px; background: #c2255c; }
    .plate { width: 245px; height: 9px; background: #e9ecef; border-radius: 10px; }

    .candles-flex {
      display: flex;
      gap: 20px;
      margin-bottom: -4px;
      z-index: 5;
    }
    .c-stick {
      width: 10px; height: 34px;
      background: repeating-linear-gradient(45deg, #fff, #fff 5px, #ff4d79 5px, #ff4d79 10px);
      border-radius: 3px;
      position: relative;
    }
    .c-flame {
      width: 14px; height: 22px;
      background: radial-gradient(circle, #fff 15%, #ffd166 55%, #ff6b00 95%);
      border-radius: 50% 50% 35% 35%;
      position: absolute;
      top: -23px; left: -2px;
      box-shadow: 0 0 16px #ffd166, 0 0 32px #ff6b00;
      animation: flameDance 0.14s infinite alternate;
      transition: all 0.4s ease;
    }
    .c-flame.out { opacity: 0; transform: translateY(-18px) scale(0); }
    @keyframes flameDance {
      from { transform: rotate(-4deg) scale(0.94); }
      to { transform: rotate(4deg) scale(1.06); }
    }

    .mic-gauge {
      width: 260px;
      height: 10px;
      background: rgba(255,255,255,0.1);
      border-radius: 10px;
      overflow: hidden;
      margin: 12px auto 6px;
      border: 1px solid rgba(255,255,255,0.15);
    }
    .mic-fill {
      height: 100%;
      width: 4%;
      background: linear-gradient(90deg, var(--cyan), var(--accent));
      box-shadow: 0 0 12px var(--accent);
      transition: width 0.08s;
    }

    .final-letter {
      display: none;
      max-width: 440px;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 122, 168, 0.35);
      border-radius: 22px;
      padding: 22px;
      margin-top: 12px;
      text-align: right;
      line-height: 1.85;
      font-size: 1.02rem;
      color: #f8f9fa;
      animation: fadeUp 0.9s ease forwards;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <!-- موسيقى بيانو سينمائية حقيقية هادئة (ويمكن وضع ملف music.mp3 في نفس المجلد) -->
  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
  </audio>

  <canvas id="universe"></canvas>

  <!-- الهيدر العائم -->
  <div class="hud-header">
    <div class="timeline-bar">
      <div class="step-pill active" id="pill1"></div>
      <div class="step-pill" id="pill2"></div>
      <div class="step-pill" id="pill3"></div>
      <div class="step-pill" id="pill4"></div>
      <div class="step-pill" id="pill5"></div>
    </div>
    <button class="audio-pill" id="audioBtn" onclick="toggleAudio()">
      <div class="audio-bars"><span></span><span></span><span></span></div>
      <span id="audioText">الموسيقى</span>
    </button>
  </div>

  <!-- ================= المشهد 1: البصمة بموشن جرافيك وتخطيط القلب ================= -->
  <section class="scene active" id="scene1">
    <div class="tag-line">BIOMETRIC ACCESS // HANEEN</div>
    <h1 class="scene-title">تأثير خاص غير معتاد</h1>
    <p class="scene-sub">
      في الطب كل حاجة ليها قانون ومعدل ثابت.. إلا النبض ده اللي بيخرج عن القاعدة كل ما بتكوني موجودة.
    </p>

    <div class="monitor-wrap">
      <canvas id="heartMorphCanvas"></canvas>
    </div>

    <!-- البصمة بموشن جرافيك SVG -->
    <div class="bio-scanner-wrap" id="bioScanner"
         onmousedown="startScan()" onmouseup="stopScan()"
         ontouchstart="startScan(event)" ontouchend="stopScan()">
      <svg class="bio-svg" viewBox="0 0 120 120">
        <circle class="ring-bg" cx="60" cy="60" r="55"></circle>
        <circle class="ring-spin" cx="60" cy="60" r="48"></circle>
        <circle class="ring-progress" id="scanProgressCircle" cx="60" cy="60" r="55"></circle>
      </svg>
      <div class="fingerprint-core">
        <div class="laser-line"></div>
        <svg class="fp-icon" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12C2 6.5 6.5 2 12 2a10 10 0 0 1 8 4"></path>
          <path d="M5 19.5C5.5 18 6 15 6 12c0-.7.12-1.37.34-2"></path>
          <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02"></path>
          <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4"></path>
          <path d="M8.65 22c.21-.66.45-1.32.57-2"></path>
          <path d="M14 13.12c0 2.38 0 6.38-1 8.88"></path>
          <path d="M2 16h.01"></path>
          <path d="M21.8 16c.2-2 .131-5.354 0-6"></path>
          <pa
