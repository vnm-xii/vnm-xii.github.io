<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Haneen ✨</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Dancing+Script:wght@700&family=Share+Tech+Mono&display=swap');

    * {
      margin: 0; padding: 0; box-sizing: border-box;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #040409;
      color: #fff;
      font-family: 'Tajawal', sans-serif;
      touch-action: none;
    }

    /* الكانفاس الرئيسي (واخد الشاشة كلها ومفيش أي طبقة بتحجبه) */
    canvas#mainCanvas {
      position: fixed;
      inset: 0;
      width: 100%; height: 100%;
      z-index: 1;
      display: block;
    }

    /* هيدر عائم بسيط جداً بدون صناديق */
    .minimal-hud {
      position: fixed;
      top: 22px; left: 22px; right: 22px;
      z-index: 50;
      display: flex;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
    }
    .hud-tag {
      font-family: 'Share Tech Mono', monospace;
      font-size: 0.8rem;
      color: #ff4d79;
      letter-spacing: 2px;
      text-shadow: 0 0 10px #ff4d79;
    }
    .music-pill {
      pointer-events: auto;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: #fff;
      padding: 6px 15px;
      border-radius: 30px;
      font-family: 'Tajawal', sans-serif;
      font-size: 0.82rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
    }

    /* نصوص سينمائية عائمة بدون صناديق */
    .floating-caption {
      position: fixed;
      top: 72px; left: 0; right: 0;
      text-align: center;
      z-index: 20;
      pointer-events: none;
      padding: 0 20px;
    }
    .floating-caption h1 {
      font-size: 1.65rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 0 0 20px rgba(255, 42, 122, 0.8);
      margin-bottom: 6px;
    }
    .floating-caption p {
      font-size: 0.98rem;
      color: #ffb3c6;
      max-width: 420px;
      margin: 0 auto;
      line-height: 1.6;
      text-shadow: 0 2px 10px #000;
    }

    /* منطقة الأزرار السفلية العائمة */
    .bottom-dock {
      position: fixed;
      bottom: 32px; left: 0; right: 0;
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      pointer-events: none;
      padding: 0 20px;
    }

    .glow-btn {
      pointer-events: auto;
      background: linear-gradient(135deg, #ff1e56, #a30b37);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.3);
      padding: 13px 36px;
      border-radius: 50px;
      font-family: 'Tajawal', sans-serif;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 0 25px rgba(255, 30, 86, 0.6);
      transition: transform 0.2s;
    }
    .glow-btn:active { transform: scale(0.94); }

    /* كبسولات الملاحظات الـ 4 العائمة تحت القلب */
    .notes-bar {
      display: none;
      pointer-events: auto;
      gap: 10px;
      margin-bottom: 4px;
    }
    .note-pill {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255, 77, 121, 0.5);
      color: #fff;
      font-weight: 700;
      display: flex; justify-content: center; align-items: center;
      cursor: pointer;
      transition: all 0.3s;
    }
    .note-pill.active {
      background: #ff1e56;
      box-shadow: 0 0 18px #ff1e56;
      transform: scale(1.15);
    }

    /* ================= مشهد الصور (Polaroids العائمة) ================= */
    .Overlay-scene {
      position: fixed;
      inset: 0;
      z-index: 25;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none;
    }
    .polaroid-box {
      pointer-events: auto;
      width: 280px;
      background: #fff;
      padding: 12px 12px 22px 12px;
      border-radius: 12px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.9), 0 0 30px rgba(255, 42, 122, 0.35);
      cursor: pointer;
      transform: rotate(-2deg);
      transition: transform 0.4s ease;
    }
    .polaroid-pic {
      width: 100%; height: 230px;
      border-radius: 6px;
      background-size: cover;
      background-position: center;
      background-color: #161224;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 14px;
      position: relative;
      overflow: hidden;
    }
    .polaroid-pic::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to top, rgba(0,0,0,0.8) 5%, transparent 55%);
    }
    .polaroid-pic span {
      position: relative; z-index: 2;
      color: #ffd166; font-weight: 700; font-size: 0.85rem;
    }
    .polaroid-cap {
      color: #1a1a2e;
      font-weight: 700;
      font-size: 0.98rem;
      margin-top: 14px;
      text-align: center;
      line-height: 1.5;
    }

    /* ================= مشهد الوردة المطابق 100% للفيديو الأول ================= */
    .flower-scene-wrap {
      pointer-events: auto;
      width: 320px; height: 320px;
      border-radius: 50%;
      background: #1a1e46;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 55px rgba(245, 148, 184, 0.35), inset 0 0 35px rgba(0,0,0,0.6);
      border: 2px solid rgba(245, 148, 184, 0.35);
    }
    .f-hill1 { position: absolute; bottom: 25px; left: -40px; width: 240px; height: 110px; background: #14193d; border-radius: 50%; }
    .f-hill2 { position: absolute; bottom: 15px; right: -45px; width: 250px; height: 110px; background: #172a45; border-radius: 50%; }
    .f-hill3 { position: absolute; bottom: -30px; left: -20px; right: -20px; height: 95px; background: #0d2833; border-radius: 50% 50% 0 0; z-index: 2; }

    .f-title {
      position: absolute;
      top: 34px; width: 100%;
      text-align: center;
      font-family: 'Georgia', serif;
      font-weight: bold;
      font-size: 1.5rem;
      color: #ff3b6b;
      text-shadow: 0 0 15px #f594b8;
      z-index: 6;
      line-height: 1.25;
    }
    .f-title span { display: block; color: #f594b8; font-size: 1.3rem; }

    .f-dome {
      position: absolute;
      bottom: 35px; left: 50%;
      transform: translateX(-50%);
      width: 118px; height: 168px;
      border: 2.5px solid rgba(170, 225, 255, 0.38);
      border-bottom: 6px solid #071921;
      border-radius: 60px 60px 6px 6px;
      background: linear-gradient(135deg, rgba(255,255,255,0.14) 0%, rgba(245,148,184,0.06) 50%, rgba(0,210,255,0.1) 100%);
      box-shadow: 0 0 35px rgba(245, 148, 184, 0.35), inset 10px 0 18px rgba(255,255,255,0.2);
      z-index: 5;
    }
    .f-stem { position: absolute; bottom: 0; left: 56px; width: 5px; height: 82px; background: #0d694e; }
    .f-leaf { position: absolute; width: 24px; height: 14px; background: #138765; border-radius: 16px 0 16px 0; }
    .f-leaf.l { bottom: 34px; left: 34px; transform: rotate(-25deg); }
    .f-leaf.r { bottom: 45px; left: 59px; transform: rotate(25deg) scaleX(-1); }

    .f-petals {
      position: absolute;
      bottom: 72px; left: 50%;
      transform: translateX(-50%);
      width: 56px; height: 56px;
    }
    .f-petals > div {
      position: absolute;
      border-radius: 15px;
      box-shadow: 0px 0px 30px #f594b8;
      background: linear-gradient(to bottom, #ff7aa8, #d52d58 70%, #9e1b3e);
    }
    .f-petals > div:nth-child(1) { width: 26px; height: 38px; left: 15px; top: 8px; border-radius: 14px 14px 18px 18px; z-index: 5; }
    .f-petals > div:nth-child(2) { width: 24px; height: 35px; left: 5px; top: 11px; transform: rotate(-20deg); z-index: 4; }
    .f-petals > div:nth-child(3) { width: 24px; height: 35px; right: 5px; top: 11px; transform: rotate(20deg); z-index: 4; }
    .f-petals > div:nth-child(4) { width: 22px; height: 30px; left: -1px; top: 15px; transform: rotate(-38deg); background: #b51f45; z-index: 3; }
    .f-petals > div:nth-child(5) { width: 22px; height: 30px; right: -1px; top: 15px; transform: rotate(38deg); background: #b51f45; z-index: 3; }

    .f-dead-petal {
      position: absolute;
      width: 14px; height: 9px;
      left: 52px; top: 55px;
      background: #d52d58;
      border-radius: 12px 0 12px 0;
      box-shadow: 0 0 12px #f594b8;
      animation: fallingPetal 4.2s ease-in-out infinite;
      z-index: 4;
    }
    @keyframes fallingPetal {
      0% { transform: translate(0, 0) rotate(-30deg); opacity: 1; }
      75% { transform: translate(-22px, 78px) rotate(40deg); opacity: 1; }
      100% { transform: translate(-24px, 82px) rotate(55deg); opacity: 0; }
    }

    /* ================= مشهد التورتة والمايكروفون المطابق للفيديو 4 ================= */
    .cake-container {
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      cursor: pointer;
    }
    .candles-row {
      display: flex;
      gap: 14px;
      margin-bottom: -5px;
      z-index: 5;
      opacity: 0;
    }
    .candle {
      width: 8px; height: 36px;
      background: repeating-linear-gradient(45deg, #fff, #fff 4px, #ff2a7a 4px, #ff2a7a 8px);
      border-radius: 3px;
      position: relative;
    }
    .flame {
      width: 13px; height: 22px;
      background: radial-gradient(circle, #fff 15%, #ffeb3b 55%, #ff6b00 95%);
      border-radius: 50% 50% 35% 35%;
      position: absolute;
      top: -24px; left: -2.5px;
      box-shadow: 0 0 18px #ffeb3b, 0 0 35px #ff6b00;
      animation: flicker 0.14s infinite alternate;
      transition: all 0.4s ease;
    }
    .flame.out { opacity: 0; transform: translateY(-20px) scale(0); }
    @keyframes flicker {
      from { transform: rotate(-4deg) scale(0.94); }
      to { transform: rotate(4deg) scale(1.06); }
    }

    .c-icing {
      width: 214px; height: 22px;
      background: #fff0f5;
      border-radius: 12px 12px 8px 8px;
      z-index: 4;
      margin-bottom: -10px;
      transform: translateY(-200px);
      opacity: 0;
    }
    .c-layer {
      width: 210px; height: 42px;
      background: #7c4d2b;
      border-radius: 8px;
      margin-top: -3px;
      border-bottom: 4px solid #fff0f5;
      box-shadow: 0 6px 15px rgba(0,0,0,0.5);
      transform: translateY(-200px);
      opacity: 0;
    }
    .c-plate {
      width: 250px; height: 10px;
      background: #e2e8f0;
      border-radius: 10px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.8);
    }

    .mic-meter {
      width: 240px; height: 8px;
      background: rgba(255,255,255,0.12);
      border-radius: 10px;
      overflow: hidden;
      margin-top: 22px;
    }
    .mic-fill {
      width: 4%; height: 100%;
      background: linear-gradient(90deg, #00f0ff, #ff1e56);
      box-shadow: 0 0 12px #ff1e56;
      transition: width 0.08s;
    }

    /* الرسالة الذهبية النهائية */
    .golden-finale {
      display: none;
      max-width: 430px;
      padding: 20px;
      text-align: center;
      pointer-events: auto;
    }
    .golden-cursive {
      font-family: 'Dancing Script', cursive;
      font-size: 3.3rem;
      color: #ffd166;
      text-shadow: 0 0 25px rgba(255, 209, 102, 0.7);
      margin-bottom: 14px;
    }
    .final-letter-text {
      font-size: 1.08rem;
      line-height: 1.9;
      color: #f8f9fa;
      text-shadow: 0 2px 12px #000;
    }
  </style>
</head>
<body>

  <audio id="bgMusic" loop preload="auto">
    <source src="music.mp3" type="audio/mpeg">
    <source src="https://cdn.pixabay.com/download/audio/2022/05/27/audio_1808fbf07a.mp3" type="audio/mpeg">
  </audio>

  <canvas id="mainCanvas"></canvas>

  <!-- الهيدر العائم -->
  <div class="minimal-hud">
    <div class="hud-tag" id="hudStatus">ECG // HANEEN</div>
    <button class="music-pill" onclick="toggleAudio()">🎵 <span id="musicState">الصوت</span></button>
  </div>

  <!-- العنوان السينمائي العائم -->
  <div class="floating-caption" id="topCaption">
    <h1 id="capTitle">نبض خارج القواعد الطبية</h1>
    <p id="capDesc">المسى الشاشة في أي مكان عشان تشوفي تخطيط النبض بيتحول لإيه لما بتكوني موجودة ✨</p>
  </div>

  <!-- مشاهد الـ Overlay (الصور، الوردة، التورتة) -->
  <!-- المشهد 2: ألبوم صور الخروجات -->
  <div class="Overlay-scene" id="photoScene">
    <div class="polaroid-box" id="polBox" onclick="flipNextPhoto()">
      <div class="polaroid-pic" id="polPic" style="background-image: url('photo1.jpg'), linear-gradient(135deg, #2b1055, #d52d58);">
        <span id="polBadge">اللقطة 1 / 4 ✨</span>
      </div>
      <div class="polaroid-cap" id="polCap">من البداية وكان واضح إنك شخص مختلف ومميز 🌹</div>
    </div>
  </div>

  <!-- المشهد 3: الوردة السحرية المطابقة للفيديو 1 -->
  <div class="Overlay-scene" id="roseScene">
    <div class="flower-scene-wrap" id="flowerCircle">
      <div class="f-title">
        Happy Birthday
        <span>Haneen ❤️</span>
      </div>
      <div class="f-hill1"></div>
      <div class="f-hill2"></div>
      <div class="f-hill3"></div>
      <div class="f-dome">
        <div class="f-stem"></div>
        <div class="f-leaf l"></div>
        <div class="f-leaf r"></div>
        <div class="f-dead-petal"></div>
        <div class="f-petals">
          <div></div><div></div><div></div><div></div><div></div>
        </div>
      </div>
    </div>
  </div>

  <!-- المشهد 4: التورتة والمايكروفون والرسالة الذهبية -->
  <div class="Overlay-scene" id="cakeScene">
    <div class="cake-container" id="cakeBox" onclick="blowOutCandles()">
      <div class="candles-row" id="candlesRow">
        <div class="candle"><div class="flame"></div></div>
        <div class="candle"><div class="flame"></div></div>
        <div class="candle"><div class="flame"></div></div>
        <div class="candle"><div class="flame"></div></div>
        <div class="candle"><div class="flame"></div></div>
      </div>
      <div class="c-icing" id="cIcing"></div>
      <div class="c-layer" id="cL1"></div>
      <div class="c-layer" id="cL2"></div>
      <div class="c-layer" id="cL3"></div>
      <div class="c-plate"></div>

      <div class="mic-meter" id="micMeter">
        <div class="mic-fill" id="micFill"></div>
      </div>
    </div>

    <div class="golden-finale" id="goldenFinale">
      <div class="golden-cursive">Happy Birthday Haneen</div>
      <div class="final-letter-text" id="finalMsgBox"></div>
    </div>
  </div>

  <!-- الأزرار السفلية العائمة -->
  <div class="bottom-dock">
    <div class="notes-bar" id="notesBar">
      <div class="note-pill active" onclick="showDoctorNote(0)">1</div>
      <div class="note-pill" onclick="showDoctorNote(1)">2</div>
      <div class="note-pill" onclick="showDoctorNote(2)">3</div>
      <div class="note-pill" onclick="showDoctorNote(3)">4</div>
    </div>
    <button class="glow-btn" id="mainActionBtn" onclick="advanceStep()">ابدئي التجربة ✨</button>
  </div>

  <script>
    // ================= 1. الصوت =================
    const bgMusic = document.getElementById('bgMusic');
    let playing = false;
    function toggleAudio() {
      if (playing) {
        bgMusic.pause(); playing = false;
        document.getElementById('musicState').innerText = 'تشغيل';
      } else {
        bgMusic.volume = 0.6;
        bgMusic.play().then(() => {
          playing = true;
          document.getElementById('musicState').innerText = 'إيقاف';
        }).catch(() => {});
      }
    }

    // ================= 2. محرك الـ 3D Particles + Text Heart (سلس 100% باللمس) =================
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    let W, H;
    function resize() {
      W = canvas.width = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    const TOTAL = 1600;
    const pts = [];
    let visualState = 'ECG'; // 'ECG' -> 'HEART_3D' -> 'BACKGROUND'

    // زوايا الدوران الفيزيائية (تعمل باللمس مباشرة على الشاشة)
    let rotY = 0;
    let rotX = 0;
    let velY = 0.008;
    let velX = 0;
    let dragging = false;
    let lastX = 0, lastY = 0;

    for (let i = 0; i < TOTAL; i++) {
      // توزيع ثلاثي الأبعاد كامل على سطح وحجم القلب
      const t = Math.random() * Math.PI * 2;
      const r = Math.pow(Math.random(), 0.35);
      const hx = 16 * Math.pow(Math.sin(t), 3) * r;
      const hy = -(13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t)) * r;
      const hz = (Math.random() - 0.5) * 14 * Math.sin(t) * r;

      pts.push({
        x: (i / TOTAL) * W,
        y: H / 2,
        z: 0,
        hx: hx * 11,
        hy: hy * 11,
        hz: hz * 11,
        size: Math.random() * 2.2 + 0.8,
        color: Math.random() > 0.15 ? '#ff1e56' : '#00f0ff',
        isWord: i % 45 === 0
      });
    }

    // ربط اللمس مباشرة بالنافذة عشان القلب يلف مع حركة الصباع بدون أي تقطيع
    window.addEventListener('touchstart', e => {
      if (e.target.closest('button') || e.target.closest('.note-pill') || e.target.closest('.polaroid-box')) return;
      if (visualState === 'ECG') {
        advanceStep();
        return;
      }
      dragging = true;
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchmove', e => {
      if (!dragging) return;
      const dx = e.touches[0].clientX - lastX;
      const dy = e.touches[0].clientY - lastY;
      velY = dx * 0.012;
      velX = dy * 0.012;
      rotY += velY;
      rotX = Math.max(-0.8, Math.min(0.8, rotX + velX));
      lastX = e.touches[0].clientX;
      lastY = e.touches[0].clientY;
    }, { passive: true });

    window.addEventListener('touchend', () => { dragging = false; });

    // دعم الماوس أيضاً للابتوب
    window.addEventListener('mousedown', e => {
      if (e.target.closest('button') || e.target.closest('.note-pill') || e.target.closest('.polaroid-box')) return;
      if (visualState === 'ECG') { advanceStep(); return; }
      dragging = true;
      lastX = e.clientX; lastY = e.clientY;
    });
    window.addEventListener('mousemove', e => {
      if (!dragging) return;
      velY = (e.clientX - lastX) * 0.01;
      velX = (e.clientY - lastY) * 0.01;
      rotY += velY;
      rotX = Math.max(-0.8, Math.min(0.8, rotX + velX));
      lastX = e.clientX; lastY = e.clientY;
    });
    window.addEventListener('mouseup', () => { dragging = false; });

    let tick = 0;
    function renderLoop() {
      ctx.fillStyle = 'rgba(4, 4, 9, 0.3)';
      ctx.fillRect(0, 0, W, H);
      tick += 0.05;

      if (!dragging && visualState !== 'ECG') {
        rotY += velY;
        velY = velY * 0.95 + 0.006 * 0.05;
        rotX *= 0.95;
      }

      const beat = visualState === 'HEART_3D' ? (1 + Math.pow(Math.sin(tick * 1.5), 6) * 0.12) : 1;
      const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
      const cosX = Math.cos(rotX), sinX = Math.sin(rotX);

      for (let i = 0; i < TOTAL; i++) {
        const p = pts[i];

        if (visualState === 'ECG') {
          // خط تخطيط القلب الطبي الحي كما في بداية الفيديو الثالث
          const norm = i / TOTAL;
          const sx = norm * W;
          const wave = ((norm * 3.5 - tick * 0.35) % 1 + 1) % 1;
          let offset = 0;
          if (wave > 0.42 && wave < 0.45) offset = -20;
          else if (wave >= 0.45 && wave < 0.48) offset = -110;
          else if (wave >= 0.48 && wave < 0.51) offset = 85;
          else if (wave >= 0.51 && wave < 0.54) offset = -30;
          else if (wave >= 0.58 && wave < 0.65) offset = -32 * Math.sin((wave - 0.58) / 0.07 * Math.PI);

          p.x += (sx - p.x) * 0.3;
          p.y += ((H / 2 + offset + (Math.random() - 0.5) * 4) - p.y) * 0.3;
        } else {
          // دوران ثلاثي الأبعاد حقيقي حول المحورين X و Y
          const scaleMult = visualState === 'BACKGROUND' ? 1.8 : beat;
          let x1 = p.hx * scaleMult;
          let y1 = p.hy * scaleMult;
          let z1 = p.hz * scaleMult;

          // دوران Y
          let rx = x1 * cosY - z1 * sinY;
          let rz = x1 * sinY + z1 * cosY;
          // دوران X
          let ry = y1 * cosX - rz * sinX;
          rz = y1 * sinX + rz * cosX;

          const fov = 420;
          const proj = fov / (fov + rz + 260);
          const tx = W / 2 + rx * proj;
          const ty = H / 2 + ry * proj;

          p.x += (tx - p.x) * 0.09;
          p.y += (ty - p.y) * 0.09;
        }

        if (visualState === 'HEART_3D' && p.isWord) {
          ctx.fillStyle = 'rgba(255, 180, 210, 0.75)';
          ctx.font = '10px Share Tech Mono';
          ctx.fillText('Haneen', p.x, p.y);
        } else {
          ctx.beginPath();
          ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
          ctx.fillStyle = visualState === 'BACKGROUND' ? 'rgba(255, 30, 86, 0.22)' : p.color;
          ctx.fill();
        }
      }

      if (visualState === 'HEART_3D') {
        ctx.save();
        ctx.textAlign = 'center';
        ctx.fillStyle = '#fff';
        ctx.shadowBlur = 20;
        ctx.shadowColor = '#ff1e56';
        ctx.font = 'bold 26px Georgia, serif';
        ctx.fillText('HANEEN', W / 2, H / 2 - 4);
        ctx.font = '11px Share Tech Mono';
        ctx.fillStyle = '#00f0ff';
        ctx.fillText('DRAG TO ROTATE 360°', W / 2, H / 2 + 18);
        ctx.restore();
      }

      requestAnimationFrame(renderLoop);
    }
    renderLoop();

    // ================= 3. تسلسل المشاهد والملاحظات =================
    let currentStep = 0;

    const docNotes = [
      { t: "01 // استثناء القاعدة الطبية", d: "في الطب كل نبضة ليها تفسير علمي، إلا الراحة والهدوء اللي بيحصلوا لما بنتكلم.. حضورك بيكسر أي روتين من غير مجهود." },
      { t: "02 // القيمة مش بالوقت", d: "الموضوع عمره ما كان بعدد الأيام، الموضوع بقيمة الشخص وتأثيره.. وأنتِ من البداية أثبتي إنك شخص مختلف ومكسب حقيقي." },
      { t: "03 // تفاصيل خروجاتنا ☕", d: "كل مرة بننزل فيها وكل لقطة بنتصورها بتأكدلي إن الوقت معاكي بيمشي بقانون تاني.. الساعات بتعدي كأنها دقايق." },
      { t: "04 // التشخيص النهائي 🩺", d: "تقدير كبير لروحك ولشخصيتك اللي بتخلي أي يوم أروق.. حركي القلب بإيدك أو اضغطي تحت عشان نفتح أرشيف صورنا." }
    ];

    function showDoctorNote(idx) {
      document.querySelectorAll('.note-pill').forEach((b, i) => b.classList.toggle('active', i === idx));
      document.getElementById('capTitle').innerText = docNotes[idx].t;
      document.getElementById('capDesc').innerText = docNotes[idx].d;
      velY = 0.09; // دفعة دوران سريعة مع كل ضغطة
    }

    function advanceStep() {
      if (!playing) toggleAudio();
      currentStep++;

      if (currentStep === 1) {
        // التحول إلى القلب ثلاثي الأبعاد
        visualState = 'HEART_3D';
        document.getElementById('hudStatus').innerText = '3D HEART // INTERACTIVE';
        document.getElementById('notesBar').style.display = 'flex';
        showDoctorNote(0);
        document.getElementById('mainActionBtn').innerText = 'لقطات من خروجاتنا 📸';
      }
      else if (currentStep === 2) {
        // مشهد الصور العائمة
        visualState = 'BACKGROUND';
        document.getElementById('notesBar').style.display = 'none';
        document.getElementById('capTitle').innerText = 'لقطات بتحكي لوحدها 📸';
        document.getElementById('capDesc').innerText = 'اضغطي على الصورة عشان تقلبي في ذكريات خروجاتنا سوا';
        document.getElementById('photoScene').style.display = 'flex';
        document.getElementById('mainActionBtn').innerText = 'الوردة المضيئة 🌹';
      }
      else if (currentStep === 3) {
        // مشهد الوردة الزجاجية المطابقة للفيديو 1
        document.getElementById('photoScene').style.display = 'none';
        document.getElementById('roseScene').style.display = 'flex';
        document.getElementById('capTitle').innerText = 'وردة حنين اللي مبتذبلش 🌹';
        document.getElementById('capDesc').innerText = 'تفصيلة صغيرة تفضل منورة باسمك دايماً';
        document.getElementById('mainActionBtn').innerText = 'تورتة عيد ميلادك 🎂';
      }
      else if (currentStep === 4) {
        // مشهد التورتة والمايكروفون
        document.getElementById('roseScene').style.display = 'none';
        document.getElementById('cakeScene').style.display = 'flex';
        document.getElementById('mainActionBtn').style.display = 'none';
        document.getElementById('capTitle').innerText = 'اتمني أمنية يا حنين 🎂';
        document.getElementById('capDesc').innerText = 'انفخي في المايكروفون بتاع الموبايل (أو المسى الشموع) عشان تطفيها!';

        // أنيميشن نزول طبقات التورتة كما في الفيديو 4
        const tl = gsap.timeline({ onComplete: startMicOnly });
        tl.to('#cL3', { y: 0, opacity: 1, duration: 0.45, ease: 'bounce.out' })
          .to('#cL2', { y: 0, opacity: 1, duration: 0.45, ease: 'bounce.out' }, '-=0.2')
          .to('#cL1', { y: 0, opacity: 1, duration: 0.45, ease: 'bounce.out' }, '-=0.2')
          .to('#cIcing', { y: 0, opacity: 1, duration: 0.35 }, '-=0.1')
          .to('#candlesRow', { opacity: 1, duration: 0.4 });
      }
    }

    // ================= 4. تقليب الصور =================
    const photos = [
      { img: "url('photo1.jpg'), linear-gradient(135deg, #2b1055, #d52d58)", b: "اللقطة 1 / 4 ✨", c: "من البداية وكان واضح إنك شخص مختلف ومميز 🌹" },
      { img: "url('photo2.jpg'), linear-gradient(135deg, #0f2027, #2c5364)", b: "اللقطة 2 / 4 ☕", c: "الوقت وإحنا قاعدين سوا بيعدي بقانون تاني خالص 🌟" },
      { img: "url('photo3.jpg'), linear-gradient(135deg, #1f1c2c, #928dab)", b: "اللقطة 3 / 4 📸", c: "صورنا دايماً شايلة ضحكة حقيقية من القلب ✨" },
      { img: "url('photo4.jpg'), linear-gradient(135deg, #3a1c71, #d76d77)", b: "اللقطة 4 / 4 ❤️", c: "كل خروجة معاكي بتثبت إن اللي جاي أحلى بكتير" }
    ];
    let pIdx = 0;
    function flipNextPhoto() {
      pIdx = (pIdx + 1) % photos.length;
      const box = document.getElementById('polBox');
      gsap.fromTo(box, { scale: 0.85, rotation: 8 }, { scale: 1, rotation: pIdx % 2 === 0 ? -2 : 2, duration: 0.4, ease: 'back.out(1.7)' });
      document.getElementById('polPic').style.backgroundImage = photos[pIdx].img;
      document.getElementById('polBadge').innerText = photos[pIdx].b;
      document.getElementById('polCap').innerText = photos[pIdx].c;
    }

    // ================= 5. المايكروفون فقط (بدون كاميرا) لإطفاء الشموع =================
    let blownOut = false;
    const wishText = "كل سنة وأنتِ طيبة يا حنين.. حبيت أعملك حاجة مختلفة تشبهك وتفضل ذكرى مميزة بينا. وجودك في حياتي، خروجاتنا، وكل تفصيلة بنعيشها سوا ليها مكانة كبيرة عندي. بتمنالك سنة جديدة مليانة نجاح وفرحة، وتفضلي دايماً منورة أيامي بضحكتك. ❤️🌹🩺";

    function blowOutCandles() {
      if (blownOut) return;
      blownOut = true;
      document.querySelectorAll('.flame').forEach(f => f.classList.add('out'));
      document.getElementById('micFill').style.width = '100%';
      confetti({ particleCount: 140, spread: 90, origin: { y: 0.6 } });

      setTimeout(() => {
        document.getElementById('cakeBox').style.display = 'none';
        document.getElementById('topCaption').style.display = 'none';
        const fin = document.getElementById('goldenFinale');
        fin.style.display = 'block';

        let i = 0;
        const box = document.getElementById('finalMsgBox');
        function type() {
          if (i < wishText.length) {
            box.innerHTML += wishText.charAt(i);
            i++;
            setTimeout(type, 38);
          }
        }
        type();
      }, 1000);
    }

    function startMicOnly() {
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      navigator.mediaDevices.getUserMedia({ audio: true, video: false }).then(stream => {
        const aCtx = new (window.AudioContext || window.webkitAudioContext)();
        const src = aCtx.createMediaStreamSource(stream);
        const analyser = aCtx.createAnalyser();
        analyser.fftSize = 256;
        src.connect(analyser);
        const data = new Uint8Array(analyser.frequencyBinCount);

        function checkMic() {
          if (blownOut) return;
          analyser.getByteFrequencyData(data);
          let avg = data.reduce((a, b) => a + b, 0) / data.length;
          document.getElementById('micFill').style.width = Math.min(100, (avg / 42) * 100) + '%';
          if (avg > 42) {
            blowOutCandles();
            stream.getTracks().forEach(t => t.stop());
          } else {
            requestAnimationFrame(checkMic);
          }
        }
        checkMic();
      }).catch(() => {});
    }
  </script>
